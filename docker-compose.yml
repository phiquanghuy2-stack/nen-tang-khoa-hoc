services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: khoahoc
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    volumes: # THÊM
      - uploads_data:/app/uploads # THÊM
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: khoahoc
    expose:
      - "3000"
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
    restart: "no"
    volumes:
      - frontend_dist:/shared

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/usr/share/caddy:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully # SỬA: chờ chép xong

volumes:
  mysql_data:
  frontend_dist:
  uploads_data:
